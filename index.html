<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>سارا — حافظه واقعی</title>
<style>
body{margin:0;font-family:system-ui,sans-serif;background:#f7f7fb;color:#20202a}
main{max-width:720px;margin:40px auto;padding:20px}
.card{background:white;border-radius:22px;padding:24px;box-shadow:0 10px 35px #0001;margin-bottom:18px}
img{width:92px;height:92px;border-radius:50%;object-fit:cover}
input,button{font:inherit;padding:12px;border-radius:12px;border:1px solid #ddd}
input{width:100%;box-sizing:border-box;margin:8px 0}
button{cursor:pointer;border:0;background:#20202a;color:white;margin:4px}
.memory{padding:12px;border:1px solid #eee;border-radius:14px;margin:8px 0;display:flex;justify-content:space-between;gap:10px}
.small{color:#777;font-size:.9rem}
#status{margin-top:10px}
</style>
</head>
<body>
<main>
<section class="card">
<img src="assets/sara-avatar.jpg" alt="سارا">
<h1>سارا 🧠</h1>
<p>حافظهٔ واقعی و دائمی سارا با Supabase</p>
<p class="small">حافظه‌ها فقط برای حساب کاربری خودت قابل مشاهده هستند.</p>
<input id="email" type="email" placeholder="ایمیل برای ورود">
<button id="login">ورود با لینک امن</button>
<div id="status" class="small"></div>
</section>

<section class="card" id="memoryCard" hidden>
<h2>حافظه‌های سارا</h2>
<input id="memory" placeholder="مثلاً: من قهوه تلخ دوست دارم">
<button id="save">به خاطر بسپار</button>
<input id="search" placeholder="جست‌وجو در حافظه">
<div id="list"></div>
<button id="logout">خروج</button>
</section>
</main>

<script type="module">
import { createClient } from "https://esm.sh/@supabase/supabase-js@2";
const SUPABASE_URL="https://fzrrtdhmrbuwsnwzjkoq.supabase.co";
const SUPABASE_KEY="sb_publishable_wAgPILCmdEwUwcKMRpohkA_ZFL7I0TM";
const API=SUPABASE_URL+"/functions/v1/sara-memory";
const supabase=createClient(SUPABASE_URL,SUPABASE_KEY);
const $=id=>document.getElementById(id);
async function session(){const {data}=await supabase.auth.getSession(); return data.session}
async function api(path="",opts={}){const s=await session(); if(!s) throw Error("ابتدا وارد شو."); const r=await fetch(API+path,{...opts,headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.access_token}}); const d=await r.json(); if(!r.ok) throw Error(d.error||"خطا"); return d}
async function load(){try{const d=await api("?q="+encodeURIComponent($("search").value)); $("list").innerHTML=d.memories.map(m=>`<div class="memory"><span>${m.memory}</span><button data-id="${m.id}">حذف</button></div>`).join("")||'<p class="small">هنوز خاطره‌ای ثبت نشده.</p>'; document.querySelectorAll("[data-id]").forEach(b=>b.onclick=async()=>{await api("",{method:"DELETE",body:JSON.stringify({id:b.dataset.id})});load()})}catch(e){$("status").textContent=e.message}}
supabase.auth.onAuthStateChange(async(_event,s)=>{if(s){$("memoryCard").hidden=false;$("status").textContent="وارد شدی؛ حافظه آماده است. 💗";load()}else $("memoryCard").hidden=true});
$("login").onclick=async()=>{const email=$("email").value.trim();if(!email)return $("status").textContent="ایمیل را وارد کن.";const {error}=await supabase.auth.signInWithOtp({email,options:{emailRedirectTo:location.href}});$("status").textContent=error?error.message:"لینک ورود به ایمیلت فرستاده شد. 📩"};
$("save").onclick=async()=>{const memory=$("memory").value.trim();if(!memory)return;await api("",{method:"POST",body:JSON.stringify({memory,importance:4})});$("memory").value="";load()};
$("search").oninput=load;
$("logout").onclick=()=>supabase.auth.signOut();
</script>
</body>
</html>
