<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سارا — Sara Live</title>
<style>
body{margin:0;background:linear-gradient(135deg,#fff7fb,#f7f5ff);color:#24232d;font-family:system-ui,sans-serif}
main{max-width:900px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #eee;border-radius:24px;padding:20px;box-shadow:0 12px 40px #0001}
header{display:flex;gap:14px;align-items:center}header img{width:72px;height:72px;border-radius:50%}h1{margin:.2em 0}.small{color:#777}
.chat{height:50vh;min-height:330px;overflow:auto;padding:8px;background:#faf9fc;border-radius:18px;margin-top:14px}
.msg{max-width:84%;padding:12px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap;line-height:1.8}.user{background:#eee9f5;margin-right:auto}.assistant{background:#ffeaf2;margin-left:auto}
.row{display:flex;gap:8px;margin-top:10px}input{flex:1;min-width:0;font:inherit;border:1px solid #ddd;border-radius:14px;padding:12px}
button{font:inherit;border:0;border-radius:14px;padding:12px 16px;background:#25232d;color:#fff;cursor:pointer}button:disabled{opacity:.55;cursor:not-allowed}
.tools{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.tools button{background:#fff;color:#25232d;border:1px solid #ddd}
.live{display:none;margin-top:12px;border-radius:20px;overflow:hidden;background:#17151d;position:relative}.live video{display:block;width:100%;max-height:420px;object-fit:cover}.live .hint{position:absolute;bottom:10px;right:10px;background:#0009;color:#fff;padding:7px 10px;border-radius:12px}
.avatar-stage{position:relative;width:72px;height:72px;flex:0 0 72px}.avatar-stage img{width:72px;height:72px;border-radius:50%;object-fit:cover;position:relative;z-index:2}.avatar-glow{position:absolute;inset:-5px;border:2px solid #ff689d;border-radius:50%;opacity:.25;z-index:1}.avatar-mouth{display:none;position:absolute;z-index:3;width:16px;height:5px;left:28px;bottom:18px;border-radius:50%;background:#7d314e}.speaking .avatar-glow{display:block;animation:pulse 900ms ease-in-out infinite}.speaking .avatar-mouth{display:block;animation:mouth .18s ease-in-out infinite alternate}@keyframes pulse{50%{transform:scale(1.08);opacity:.75}}@keyframes mouth{from{height:3px}to{height:10px}}.badge{display:inline-block;margin-top:5px;padding:4px 9px;border-radius:999px;background:#f5e9ff;color:#7c3aed;font-size:12px}
</style></head>
<body><main><section class="card">
<header><div class="avatar-stage" id="avatarStage"><img src="assets/sara-avatar.jpg" alt="سارا"><span class="avatar-glow"></span><span class="avatar-mouth"></span></div><div><h1>سارا 💗</h1><div class="small">Sara Live — گفت‌وگو، صدا و دوربین</div><span class="badge" id="mode">متن</span></div></header>
<div id="status" class="small">در حال آماده‌سازی…</div>
<div id="chat" class="chat"></div>
<div class="row"><input id="message" placeholder="پیامت رو بنویس…"><button id="send">ارسال</button></div>
<div class="tools">
<button id="mic">🎙️ صحبت با سارا</button>
<button id="speak">🔊 پخش آخرین پاسخ</button>
<button id="camera">📷 دوربین</button>
</div>
<div class="live" id="live"><video id="video" autoplay muted playsinline></video><div class="hint">نمای زنده دوربین</div></div>
</section></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const URL="https://fzrrtdhmrbuwsnwzjkoq.supabase.co",KEY="sb_publishable_wAgPILCmdEwUwcKMRpohkA_ZFL7I0TM",CHAT=URL+"/functions/v1/sara-chat",sb=createClient(URL,KEY),$=id=>document.getElementById(id);
let history=[],lastAnswer="",recognition=null,stream=null;

function add(role,text){const e=document.createElement("div");e.className="msg "+role;e.textContent=text;$("chat").appendChild(e);$("chat").scrollTop=$("chat").scrollHeight}
async function session(){const{data}=await sb.auth.getSession();return data.session}
async function guest(){const s=await session();if(s)return s;const r=await sb.auth.signInAnonymously();if(!r.error&&r.data.session)return r.data.session;throw new Error("ورود مهمان در Supabase فعال نیست.")}
function setSpeaking(on){$("avatarStage").classList.toggle("speaking",on);$("mode").textContent=on?"🔊 سارا در حال صحبت":"متن + هوش مصنوعی"}
function speak(text){if(!("speechSynthesis"in window)){add("assistant","پخش صوت در این مرورگر پشتیبانی نمی‌شود.");return}speechSynthesis.cancel();const u=new SpeechSynthesisUtterance(text);u.lang="fa-IR";u.rate=.95;u.pitch=1;u.onstart=()=>setSpeaking(true);u.onend=()=>setSpeaking(false);u.onerror=()=>setSpeaking(false);speechSynthesis.speak(u)}
async function send(textOverride){const i=$("message"),text=(textOverride??i.value).trim();if(!text)return;if(textOverride===undefined)i.value="";add("user",text);$("send").disabled=true;$("status").textContent="سارا در حال فکر کردن…";try{const s=await guest();const r=await fetch(CHAT,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.access_token},body:JSON.stringify({message:text,history})});const d=await r.json();if(!r.ok)throw Error(d.error||d.message||"خطا");const answer=d.answer||d.message||"پاسخی دریافت نشد.";lastAnswer=answer;add("assistant",answer);history.push({role:"user",content:text},{role:"assistant",content:answer});$("mode").textContent="متن + هوش مصنوعی";$("status").textContent="سارا آماده است 💗";speak(answer)}catch(e){add("assistant","خطا: "+(e?.message||"اتصال برقرار نشد."));$("status").textContent="اتصال چت برقرار نیست"}finally{$("send").disabled=false}}
function setupMic(){const SR=window.SpeechRecognition||window.webkitSpeechRecognition;if(!SR){$("mic").textContent="🎙️ میکروفون پشتیبانی نمی‌شود";return}recognition=new SR();recognition.lang="fa-IR";recognition.interimResults=false;recognition.continuous=false;recognition.onstart=()=>{$("mic").textContent="⏹️ در حال شنیدن…";$("mode").textContent="گفتار"};recognition.onresult=e=>{const text=e.results[0][0].transcript;send(text)};recognition.onerror=e=>{add("assistant","نتونستم صدا رو دریافت کنم: "+e.error)};recognition.onend=()=>{$("mic").textContent="🎙️ صحبت با سارا"};$("mic").onclick=()=>{try{recognition.start()}catch{recognition.stop()}}}
async function toggleCamera(){if(stream){stream.getTracks().forEach(t=>t.stop());stream=null;$("video").srcObject=null;$("live").style.display="none";$("camera").textContent="📷 دوربین";$("mode").textContent="متن";return}try{stream=await navigator.mediaDevices.getUserMedia({video:true,audio:false});$("video").srcObject=stream;$("live").style.display="block";$("camera").textContent="✖️ بستن دوربین";$("mode").textContent="دوربین روشن"}catch(e){add("assistant","دسترسی دوربین داده نشد یا مرورگر اجازه نداد.")}}
(async()=>{try{await guest();$("status").textContent="سارا آماده است 💗";add("assistant","سلام 🌷 من سارا هستم. حالا می‌تونیم با متن، صدا و دوربین شروع کنیم.")}catch(e){console.error(e);$("status").textContent="اتصال به سارا آماده نیست";add("assistant","فعلاً اتصال به چت برقرار نشد. در صورت خاموش بودن Anonymous Auth باید ورود ایمیلی را فعال کنیم.")}})();
$("send").onclick=()=>send();$("message").onkeydown=e=>{if(e.key==="Enter")send()};$("speak").onclick=()=>lastAnswer&&speak(lastAnswer);$("camera").onclick=toggleCamera;setupMic();
</script></body></html>
