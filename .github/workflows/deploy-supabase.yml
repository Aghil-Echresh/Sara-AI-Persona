name: Deploy Sara Edge Functions

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: sara-supabase-deploy
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy Sara to Supabase
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
      SUPABASE_PROJECT_ID: ${{ secrets.SUPABASE_PROJECT_ID }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
    steps:
      - name: Check required secrets without printing values
        shell: bash
        run: |
          set -euo pipefail
          test -n "$SUPABASE_ACCESS_TOKEN" || { echo "::error::Missing GitHub Actions secret SUPABASE_ACCESS_TOKEN"; exit 1; }
          test -n "$SUPABASE_PROJECT_ID" || { echo "::error::Missing GitHub Actions secret SUPABASE_PROJECT_ID"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "::error::Missing GitHub Actions secret OPENAI_API_KEY"; exit 1; }

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Store model credentials in Supabase Edge Function secrets
        shell: bash
        run: |
          set -euo pipefail
          supabase secrets set \
            --project-ref "$SUPABASE_PROJECT_ID" \
            "MODEL_API_KEY=$OPENAI_API_KEY" \
            "MODEL_API_URL=https://api.openai.com/v1" \
            "MODEL_NAME=gpt-4o-mini"

      - name: Deploy Sara chat function
        run: supabase functions deploy sara-chat --project-ref "$SUPABASE_PROJECT_ID"

      - name: Deploy Sara memory function
        run: supabase functions deploy sara-memory --project-ref "$SUPABASE_PROJECT_ID"
