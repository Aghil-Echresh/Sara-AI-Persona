<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سارا — چت</title>
<style>
body{margin:0;background:linear-gradient(135deg,#fff7fb,#f7f5ff);color:#24232d;font-family:system-ui,sans-serif}main{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #eee;border-radius:24px;padding:20px;box-shadow:0 12px 40px #0001}header{display:flex;gap:14px;align-items:center}header img{width:72px;height:72px;border-radius:50%}h1{margin:.2em 0}.small{color:#777}.chat{height:58vh;min-height:360px;overflow:auto;padding:8px;background:#faf9fc;border-radius:18px;margin-top:14px}.msg{max-width:84%;padding:12px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap;line-height:1.8}.user{background:#eee9f5;margin-right:auto}.assistant{background:#ffeaf2;margin-left:auto}.row{display:flex;gap:8px;margin-top:10px}input{flex:1;font:inherit;border:1px solid #ddd;border-radius:14px;padding:12px}button{font:inherit;border:0;border-radius:14px;padding:12px 18px;background:#25232d;color:#fff}
</style></head>
<body><main><section class="card">
<header><img src="assets/sara-avatar.jpg" alt="سارا"><div><h1>سارا 💗</h1><div class="small">گفت‌وگوی طبیعی با حافظه</div></div></header>
<div id="status" class="small">چت آماده است 💗</div>
<div id="chat" class="chat"></div>
<div class="row"><input id="message" placeholder="پیامت رو بنویس…"><button id="send">ارسال</button></div>
</section></main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const URL="https://fzrrtdhmrbuwsnwzjkoq.supabase.co",KEY="sb_publishable_wAgPILCmdEwUwcKMRpohkA_ZFL7I0TM",CHAT=URL+"/functions/v1/sara-chat",sb=createClient(URL,KEY),$=id=>document.getElementById(id);let history=[];
function add(role,text){const e=document.createElement("div");e.className="msg "+role;e.textContent=text;$("chat").appendChild(e);$("chat").scrollTop=$("chat").scrollHeight}
async function session(){const {data}=await sb.auth.getSession();return data.session}
async function guest(){const s=await session();if(s)return s;const r=await sb.auth.signInAnonymously();if(!r.error&&r.data.session)return r.data.session;throw new Error("ورود مهمان در Supabase فعال نیست؛ Anonymous Auth را فعال کن یا ورود ایمیلی را در نسخه بعدی استفاده کن.")}
async function send(){const i=$("message"),text=i.value.trim();if(!text)return;i.value="";add("user",text);$("send").disabled=true;try{const s=await guest();const r=await fetch(CHAT,{method:"POST",headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.access_token},body:JSON.stringify({message:text,history})});const d=await r.json();if(!r.ok)throw Error(d.error||d.message||"خطا");const answer=d.answer||d.message||"پاسخی دریافت نشد.";add("assistant",answer);history.push({role:"user",content:text},{role:"assistant",content:answer})}catch(e){add("assistant","خطا: "+(e?.message||"اتصال برقرار نشد."))}finally{$("send").disabled=false}}
(async()=>{try{const s=await guest();$("status").textContent="چت آماده است. 💗";add("assistant","سلام 🌷 من سارا هستم. مستقیم شروع کنیم؟")}catch(e){console.error(e);$("status").textContent="چت آماده نیست";add("assistant","فعلاً اتصال به چت برقرار نشد. لطفاً دوباره تلاش کن.")}})();
$("send").onclick=send;$("message").onkeydown=e=>{if(e.key==="Enter")send()};
</script></body></html>
