<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>سارا — چت با حافظه واقعی</title>
<style>
:root{font-family:Vazirmatn,system-ui,sans-serif}*{box-sizing:border-box}body{margin:0;background:linear-gradient(135deg,#fff7fb,#f7f5ff);color:#24232d}
main{max-width:820px;margin:auto;padding:18px}.card{background:#fff;border:1px solid #eee;border-radius:24px;padding:20px;box-shadow:0 12px 40px #0000000b;margin-bottom:16px}
header{display:flex;align-items:center;gap:14px}header img{width:72px;height:72px;border-radius:50%;object-fit:cover}
h1,h2{margin:.2em 0}p{line-height:1.8}.small{color:#777;font-size:.9rem}
input,button{font:inherit;border-radius:14px;padding:12px;border:1px solid #ddd}input{width:100%;margin:6px 0}button{cursor:pointer;background:#25232d;color:#fff;border:0}
button.alt{background:#f1eef6;color:#25232d}.row{display:flex;gap:8px}.row input{flex:1}
#chat{height:52vh;min-height:360px;overflow:auto;padding:8px;background:#faf9fc;border-radius:18px}
.msg{max-width:84%;padding:12px 14px;border-radius:18px;margin:8px 0;white-space:pre-wrap;line-height:1.8}.user{background:#eee9f5;margin-right:auto}.assistant{background:#ffeaf2;margin-left:auto}
#status{min-height:24px;margin-top:8px}.memory{padding:10px;border:1px solid #eee;border-radius:14px;margin:7px 0}.hidden{display:none}
</style>
</head>
<body>
<main>
<section class="card">
<header><img src="assets/sara-avatar.jpg" alt="سارا"><div><h1>سارا 💗</h1><div class="small">گفت‌وگوی طبیعی + حافظهٔ واقعی و خصوصی</div></div></header>
<div id="auth" class="hidden">
<p>بدون رمز و بدون ثبت‌نام وارد شو. اگر بخواهی، می‌توانی بعداً با ایمیل هم ورود امن داشته باشی.</p>
<div class="row"><button id="guest">ورود فوری بدون رمز</button><button class="alt" id="emailMode">ورود با ایمیل</button></div>
<div id="emailBox" class="hidden">
<input id="email" type="email" autocomplete="email" placeholder="ایمیل">
<div class="row"><button id="login">ارسال کد ۶ رقمی</button><button class="alt" id="backGuest">بازگشت</button></div>
<div id="otpBox" class="hidden"><input id="otp" inputmode="numeric" autocomplete="one-time-code" maxlength="6" placeholder="کد ۶ رقمی"><div class="row"><button id="verify">تأیید کد</button><button class="alt" id="resend">ارسال دوباره</button></div></div>
</div>
</div>
<div id="userbar" class="hidden"><span id="who"></span> <button class="alt" id="logout">خروج</button></div>
<div id="status" class="small"></div>
</section>
<section class="card hidden" id="chatCard"><h2>گفت‌وگو</h2><div id="chat"></div>
<div class="row" style="margin-top:10px"><input id="message" placeholder="مثلاً: به خاطر بسپار من عقیل هستم"><button id="send">ارسال</button></div>
<p class="small">برای ذخیرهٔ خاطره: «به خاطر بسپار ...» — برای حذف: «فراموشش کن ...»</p></section>
<section class="card hidden" id="memoryCard"><h2>🧠 حافظه‌های من</h2><div class="row"><input id="search" placeholder="جست‌وجو"><button id="refresh">تازه‌سازی</button></div><div id="list"></div></section>
</main>
<script type="module">
import{createClient}from"https://esm.sh/@supabase/supabase-js@2";
const URL="https://fzrrtdhmrbuwsnwzjkoq.supabase.co",KEY="sb_publishable_wAgPILCmdEwUwcKMRpohkA_ZFL7I0TM",MEMORY=URL+"/functions/v1/sara-memory",CHAT=URL+"/functions/v1/sara-chat",sb=createClient(URL,KEY),$=id=>document.getElementById(id);let history=[];

async function session(){return(await sb.auth.getSession()).data.session}
async function api(url,opts={}){const s=await session();if(!s)throw Error("ابتدا وارد شو.");const r=await fetch(url,{...opts,headers:{"Content-Type":"application/json","Authorization":"Bearer "+s.access_token}});let d={};try{d=await r.json()}catch{}if(!r.ok)throw Error(d.error||d.message||"خطا");return d}
function add(role,text){const e=document.createElement("div");e.className="msg "+role;e.textContent=text;$("chat").appendChild(e);$("chat").scrollTop=$("chat").scrollHeight}
async function loadMem(){try{const d=await api(MEMORY+"?q="+encodeURIComponent($("search").value));$("list").replaceChildren();const ms=d.memories||[];if(!ms.length){const p=document.createElement("p");p.className="small";p.textContent="هنوز خاطره‌ای ثبت نشده.";$("list").appendChild(p)}else ms.forEach(m=>{const wrap=document.createElement("div");wrap.className="memory";const span=document.createElement("span");span.textContent=(m.memory??m.fact??"")+" ";const b=document.createElement("button");b.className="alt";b.textContent="حذف";b.onclick=async()=>{try{await api(MEMORY,{method:"DELETE",body:JSON.stringify({id:m.id})});await loadMem()}catch(e){$("status").textContent=e.message}};wrap.append(span,b);$("list").appendChild(wrap)})}catch(e){$("status").textContent=e.message}}
async function memoryCommand(text){const remember=text.match(/^\s*(به خاطر بسپار|یادت باشه|این رو ثبت کن|این رو به حافظه اضافه کن|یادت بمونه)\s*[:：-]?\s*(.+)$/i);if(remember){await api(MEMORY,{method:"POST",body:JSON.stringify({memory:remember[2].trim(),source:"chat"})});return"saved"}const forget=text.match(/^\s*(فراموشش کن|از حافظه حذفش کن|یادم نباشه|این رو پاک کن)\s*[:：-]?\s*(.+)$/i);if(forget){const q=forget[2].trim(),d=await api(MEMORY+"?q="+encodeURIComponent(q));for(const m of(d.memories||[]))await api(MEMORY,{method:"DELETE",body:JSON.stringify({id:m.id})});return"forgot"}return null}
async function send(){const i=$("message"),text=i.value.trim();if(!text)return;i.value="";add("user",text);$("send").disabled=true;try{const cmd=await memoryCommand(text);if(cmd){await loadMem();const a=cmd==="saved"?"حتماً 💗 این مورد را به حافظه‌ام اضافه کردم.":"باشه 💗 مورد مربوط را از حافظه حذف کردم.";add("assistant",a);history.push({role:"user",content:text},{role:"assistant",content:a});return}const d=await api(CHAT,{method:"POST",body:JSON.stringify({message:text,history})});add("assistant",d.answer||d.message||"پاسخی دریافت نشد.");history.push({role:"user",content:text},{role:"assistant",content:d.answer||d.message||""})}catch(e){add("assistant","خطا: "+e.message)}finally{$("send").disabled=false}}

function showApp(s){const on=!!s;$("auth").classList.toggle("hidden",on);$("userbar").classList.toggle("hidden",!on);$("chatCard").classList.toggle("hidden",!on);$("memoryCard").classList.toggle("hidden",!on);if(s){$("who").textContent="وارد شدی: "+(s.user.email||"کاربر");$("status").textContent="حافظه آماده است. 💗";loadMem();if(!$("chat").children.length)add("assistant","سلام 🌷 من سارا هستم. بگو از کجا شروع کنیم؟")}else $("status").textContent="برای استفاده از حافظه وارد شو."}
sb.auth.onAuthStateChange((_,s)=>showApp(s));
// ورود کاملاً خودکار: هیچ صفحهٔ ورود به کاربر نمایش داده نمی‌شود.
(async()=>{const s=await session();if(s)showApp(s);else await guestLogin()})();

async function guestLogin(){ $("guest").disabled=true;$("status").textContent="در حال ورود بدون رمز…";try{const{data,error}=await sb.auth.signInAnonymously();if(error)throw error;$("status").textContent="ورود بدون رمز انجام شد. 💗"}catch(e){$("status").textContent="ورود بدون رمز در Supabase فعال نیست: "+(e?.message||"خطای نامشخص")}finally{$("guest").disabled=false}}
async function sendOtp(){const email=$("email").value.trim();if(!email){$("status").textContent="ایمیل را وارد کن.";return}$("login").disabled=true;$("status").textContent="در حال ارسال کد ۶ رقمی… 📩";try{const{error}=await sb.auth.signInWithOtp({email,options:{shouldCreateUser:true}});if(error)throw error;$("otpBox").classList.remove("hidden");$("status").textContent="کد ۶ رقمی ارسال شد. 📩";$("otp").focus()}catch(e){$("status").textContent="ارسال کد ناموفق بود: "+(e?.message||"خطای نامشخص")}finally{$("login").disabled=false}}
async function verifyOtp(){const email=$("email").value.trim(),token=$("otp").value.trim();if(!email||!/^[0-9]{6}$/.test(token)){$("status").textContent="ایمیل و کد ۶ رقمی معتبر را وارد کن.";return}$("verify").disabled=true;try{const{data,error}=await sb.auth.verifyOtp({email,token,type:"email"});if(error)throw error;if(!data.session)throw Error("نشست ورود ساخته نشد.");$("status").textContent="ورود با موفقیت انجام شد. 💗"}catch(e){$("status").textContent="کد نامعتبر یا منقضی شده است: "+(e?.message||"")}finally{$("verify").disabled=false}}
$("guest").onclick=guestLogin;$("emailMode").onclick=()=>{$("emailBox").classList.remove("hidden");$("emailMode").classList.add("hidden")};$("backGuest").onclick=()=>{$("emailBox").classList.add("hidden");$("emailMode").classList.remove("hidden")};$("login").onclick=sendOtp;$("resend").onclick=sendOtp;$("verify").onclick=verifyOtp;$("otp").onkeydown=e=>{if(e.key==="Enter")verifyOtp()};
$("send").onclick=send;$("message").onkeydown=e=>{if(e.key==="Enter")send()};$("refresh").onclick=loadMem;$("search").oninput=loadMem;$("logout").onclick=()=>sb.auth.signOut();
</script></body></html>
